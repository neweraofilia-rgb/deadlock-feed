name: Build museum presentation

on:
  push:
    branches:
      - artifact-museum-presentation
    paths:
      - "artifacts/build_museum_presentation.py"
      - ".github/workflows/build-museum-presentation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: artifact-museum-presentation
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check python-pptx pillow requests
      - name: Build and validate presentation
        run: python artifacts/build_museum_presentation.py
      - name: Upload presentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: museum-presentation-v4
          path: artifacts/muzei_promyshlennoi_kultury_v4.pptx
          if-no-files-found: error
      - name: Commit presentation
        run: |
          git config user.name "Codex Presentation Builder"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/muzei_promyshlennoi_kultury_v4.pptx
          git diff --cached --quiet || git commit -m "Build varied industrial museum presentation"
          git push
